name = "WFLang"
version = "0.1.0"
defaultTargets = ["WFLang", "NonEmpty", "TyTests", "TermTests"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.34.0"

[[require]]
name = "aesop"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "WFLang"
globs = ["WFLang.+"]

[[lean_lib]]
name = "NonEmpty"
globs = ["NonEmpty.+"]

